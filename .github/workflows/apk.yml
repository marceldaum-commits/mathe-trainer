# Baut die Android-App (APK + Play-Store-Paket) auf GitHub – unabhängig von jedem einzelnen Rechner.
# Läuft von selbst bei jeder neuen Fassung auf dem Zweig test (Inhalte oder App-Hülle geändert) und auf Knopfdruck (Actions → „Mathe-Trainer – Android-App bauen“).
# Braucht zwei Geheimnisse des Repos (Settings → Secrets and variables → Actions) – sie stehen nie im Repo:
#   MT_KEYSTORE_B64  = der Signier-Schlüssel als Text (base64)
#   MT_KEYSTORE_PASS = das Passwort dazu
name: Mathe-Trainer – Android-App bauen
run-name: Mathe-Trainer – Android-App bauen (${{ github.ref_name }})
on:
  push:
    branches: [test]
    paths: ['app/stand.json', 'android/huelle.json', '.github/workflows/apk.yml']
  workflow_dispatch:
    inputs:
      kanal:
        description: 'Kanal der Selbst-Aktualisierung (test = Marcels Handy, store = Play Store)'
        type: choice
        options: [test, store]
        default: test
permissions:
  contents: write   # nur für die Test-APK unter der festen Adresse (Release apk-test), siehe letzter Schritt
jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prüfen (Dateiliste, Rechen-Tests, Selbst-Aktualisierung)
        run: |
          npm ci
          npm run check
          bash tests/android/pruefen.sh
      - name: Bauen und signieren
        env:
          MT_KEYSTORE_B64: ${{ secrets.MT_KEYSTORE_B64 }}
          MT_KEYSTORE_PASS: ${{ secrets.MT_KEYSTORE_PASS }}
          MT_KANAL: ${{ inputs.kanal || 'test' }}
        run: |
          test -n "$MT_KEYSTORE_B64" || { echo "Geheimnis MT_KEYSTORE_B64 fehlt"; exit 1; }
          test -n "$MT_KEYSTORE_PASS" || { echo "Geheimnis MT_KEYSTORE_PASS fehlt"; exit 1; }
          # Beim Einfügen rutscht leicht ein Zeilenumbruch oder Leerzeichen mit – das gehört nicht zum Passwort.
          export MT_KEYSTORE_PASS="$(printf %s "$MT_KEYSTORE_PASS" | tr -d '[:space:]')"
          umask 077
          printf %s "$MT_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/schluessel.keystore"
          export MT_KEYSTORE="$RUNNER_TEMP/schluessel.keystore"
          # Hilfe bei falsch eingetragenen Geheimnissen: nur Länge und kurze Prüfzahl, nie der Wert selbst.
          echo "Schlüssel: $(sha256sum < "$MT_KEYSTORE" | cut -c1-8) · Passwort: ${#MT_KEYSTORE_PASS} Zeichen, Prüfzahl $(printf %s "$MT_KEYSTORE_PASS" | sha256sum | cut -c1-6)"
          bash android/offline/bauen.sh
          rm -f "$MT_KEYSTORE"
          v=$(sed -n "s/.*VERSION = '\([0-9.]*\)'.*/\1/p" app/js/config.js)
          mkdir aus
          cp android/offline/app/build/outputs/apk/release/*.apk "aus/Mathe-Trainer-$v-$MT_KANAL.apk"
          cp android/offline/app/build/outputs/bundle/release/*.aab "aus/Mathe-Trainer-$v-$MT_KANAL-PlayStore.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: Mathe-Trainer-App
          path: aus/
          retention-days: 30
      # Test-Fassung unter einer festen Adresse ablegen: Die Test-App lädt sie mit „Jetzt aktualisieren“ selbst
      # (android/…/ApkLaden.java, Marcel 18.11.2026: „Das Update sollte komplett in der App laufen“). Das Repo ist öffentlich.
      - name: Test-APK veröffentlichen (Release apk-test)
        if: ${{ (inputs.kanal || 'test') == 'test' && github.ref_name == 'test' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp aus/*-test.apk "$RUNNER_TEMP/Mathe-Trainer-test.apk"
          gh release view apk-test >/dev/null 2>&1 || gh release create apk-test --prerelease --target "$GITHUB_SHA" --title "Mathe-Trainer – Test-App (immer die neueste)" --notes "Wird bei jeder neuen Fassung auf dem Zweig test ersetzt. Installation über die Test-App: „Jetzt aktualisieren“."
          gh release upload apk-test "$RUNNER_TEMP/Mathe-Trainer-test.apk" --clobber
